<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="description" content="Spots information"/><meta name="author" content="Shawn Roman"/><meta name="keywords" content="HTML CSS"/><link rel="shortcut icon" href="./images/favicon.ico" type="image/x-icon"/><title>Spots</title><script defer="defer" src="main.js"></script><link href="main.css" rel="stylesheet"></head><body><div class="page"><header class="header"><img src="images/logo.a40f8b9ceac4854ce51a.svg" alt="Spot Logo" class="header__logo"/></header><main class="content"><section class="profile page__section"><div class="profile__avatar-container"><button type="button" class="profile__avatar-btn"><img src="images/pencil-light.466fba40d06de23ed0a1.svg" alt="Pencil Icon" class="profile__pencil-icon"/></button> <img src="images/avatar.2fc47fd8e9a9bcd9612f.jpg" alt="Bessie Coleman" class="profile__avatar"/></div><div class="profile__column"><h1 class="profile__name">Bessie Coleman</h1><p class="profile__description">Civil Aviator</p><button type="button" class="profile__edit-btn"><img src="images/group2.65d8affc5335655b643b.svg" alt="Edit icon"/> <span>Edit Profile</span></button></div><button type="button" class="profile__add-btn"><img src="images/group26.40608da7369d39bc1077.svg" alt="Plus icon"/> <span>New Post</span></button></section><section class="cards page__section"><ul class="cards__list"><template id="card-template"><li class="card"><button class="card__delete-btn" type="button"></button> <img src="#" alt="" class="card__image"/><div class="card__content"><h2 class="card__title"></h2><button type="button" class="card__like-btn"></button></div></li></template></ul></section></main><footer class="footer">2025 &copy; Spots</footer><div class="modal" id="edit-profile-modal"><div class="modal__container"><button type="button" class="modal__close-btn"><img src="images/closebutton.9335fea30fb8c9c34f64.svg" alt="Submit Button"/></button><h2 class="modal__title">Edit profile</h2><form class="modal__form"><label for="profile-name-input" class="modal__label">Name <input id="profile-name-input" class="modal__input" placeholder="Type your name"/> <span class="modal__error profile-name-input-error"></span></label> <label for="profile-description-input" class="modal__label">Description <input id="profile-description-input" class="modal__input" placeholder="Describe yourself"/> <span class="modal__error profile-description-input-error"></span></label> <button type="submit" class="modal__submit-btn">Save</button></form></div></div><div class="modal" id="new-post-modal"><div class="modal__container"><button type="button" class="modal__close-btn"><img src="images/closebutton.9335fea30fb8c9c34f64.svg" alt="Submit Button"/></button><h2 class="modal__title">New post</h2><form class="modal__form"><label for="card-image-input" class="modal__label">Image link <input id="card-image-input" type="url" class="modal__input" placeholder="Paste a link to the picture"/> <span class="modal__error card-image-input-error"></span></label> <label for="image-caption-input" class="modal__label">Caption <input id="image-caption-input" class="modal__input" placeholder="Type your caption"/> <span class="modal__error image-caption-input-error"></span></label> <button type="submit" class="modal__submit-btn">Save</button></form></div></div><div class="modal" id="edit-avatar-modal"><div class="modal__container"><button type="button" class="modal__close-btn"><img src="images/closebutton.9335fea30fb8c9c34f64.svg" alt="Close Button"/></button><h2 class="modal__title">Change profile picture</h2><form class="modal__form"><label for="avatar-url-input" class="modal__label">Image link <input id="avatar-url-input" type="url" class="modal__input" placeholder="Paste a link to the picture" required/> <span class="modal__error avatar-url-input-error"></span></label> <button type="submit" class="modal__submit-btn">Save</button></form></div></div></div><div class="modal modal_type_preview" id="preview-modal"><div class="modal__image-container"><button type="button" class="modal__close-btn modal__close-btn_type_preview"><img src="images/closebuttonpreview.53f0bab7ec2e970778f9.svg" alt="Close Button"/></button> <img src="#" alt="" class="modal__image"/><p class="modal__caption"></p></div></div><div class="modal" id="avatar-modal"><div class="modal__container modal__container_type_avatar"><button type="button" class="modal__close-btn"><img src="images/closebutton.9335fea30fb8c9c34f64.svg" alt="Submit Button"/></button><h2 class="modal__title modal__title_type_avatar">Edit profile avatar</h2><form class="modal__form"><label for="profile-avatar-input" class="modal__label"><span class="modal__field-label">Profile Picture</span> <input id="profile-avatar-input" type="url" class="modal__input" placeholder="https://somewebsite.com/someimage.jpg" required/> <span class="modal__error profile-avatar-input-error"></span></label> <button type="submit" class="modal__submit-btn modal__submit-btn_type_avatar">Save</button></form></div></div><div class="modal" id="delete-modal"><div class="modal__container modal__container_type_delete"><button type="button" class="modal__close-btn modal__close-btn_type_delete"><img src="images/closebutton.9335fea30fb8c9c34f64.svg" alt="Close Button"/></button><h2 class="modal__title modal__title_type_delete">Are you sure you want to delete this image</h2><form class="modal__form modal__form_type_delete"><button type="submit" class="modal__submit-btn modal__submit-btn_type_delete">Delete</button> <button type="button" class="modal__submit-btn modal__submit-btn_type_cancel">Cancel</button></form></div></div></body></html>
